name: Build firmware

# The firmware of every target as artifacts (unimoc-jacobi, unimoc-nucleo_h743zi, unimoc-native_sim). Called by the
# Zephyr CI workflow, whose release job attaches them to the GitHub release.
# A new board or simulator is one more matrix row and a case in
# scripts/package_firmware.sh (docs/release_plan.md).
on:
  workflow_call:
    inputs:
      release:
        description: Name the files by the version alone (no commit)
        type: boolean
        default: false
    secrets:
      MCUBOOT_SIGNING_KEY:
        description: ECDSA P-256 private key (PEM) that signs the STM32H7 images; release builds only
        required: false

permissions:
  contents: read

jobs:
  firmware:
    name: firmware (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The STM32H7 boards build with MCUboot (sysbuild): bootloader, signed image and update image.
          - target: jacobi
            board: unimoc_jacobi
            artifact: unimoc-jacobi
            build_args: --sysbuild
          - target: nucleo_h743zi
            board: nucleo_h743zi
            artifact: unimoc-nucleo_h743zi
            build_args: --sysbuild
          - target: sim
            board: native_sim/native/64
            artifact: unimoc-native_sim
            build_args: ""
    steps:
      - uses: actions/checkout@v7
        with:
          path: unimoc
          submodules: recursive

      - name: Set up the west workspace and Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: unimoc
          toolchains: arm-zephyr-eabi

      - name: Install Nunavut
        run: pip install -r unimoc/scripts/requirements-cyphal.txt

      # Release builds of the STM32H7 boards are signed with the release key (docs/zephyr_workflow.md,
      # "Signing key"). Other builds (pull requests, forks) have no secret and use the public MCUboot debug
      # key: never flash those artifacts on a real board.
      - name: Signing key
        if: inputs.release && matrix.build_args == '--sysbuild'
        env:
          KEY: ${{ secrets.MCUBOOT_SIGNING_KEY }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "::error::MCUBOOT_SIGNING_KEY is not available: a release must not be signed with the debug key"
            exit 1
          fi
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/signing.pem"
          echo "SIGN_ARGS=-DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"$RUNNER_TEMP/signing.pem\"" >> "$GITHUB_ENV"

      - name: Build
        run: |
          extra=()
          if [[ -n "${SIGN_ARGS:-}" ]]; then
            extra=(-- "$SIGN_ARGS")
          fi
          west build -p always ${{ matrix.build_args }} -b ${{ matrix.board }} unimoc/apps/drive \
              -d build/${{ matrix.target }} "${extra[@]}" 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Check the signing key
        if: inputs.release && matrix.build_args == '--sysbuild'
        run: |
          if grep -q "default MCUboot signing key" build.log; then
            echo "::error::the release was signed with the MCUboot debug key"
            exit 1
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.pem"

      - name: Collect the files
        run: |
          version="$(python3 unimoc/scripts/release_version.py current)"
          if [[ "${{ inputs.release }}" != "true" ]]; then
            version="${version}-g$(git -C unimoc rev-parse --short HEAD)"
          fi
          unimoc/scripts/package_firmware.sh "${{ matrix.target }}" "build/${{ matrix.target }}" \
              "$version" firmware

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: firmware/
          if-no-files-found: error
