name: Documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  doxygen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      - run: mkdir -p build && doxygen docs/Doxyfile
      - uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: build/doxygen/html
