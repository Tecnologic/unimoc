name: Zephyr
on:
  # Feature branches are checked by their pull request only; a push trigger
  # for them would run the same commit twice. Pushes to the integration
  # branches (merges) still run.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, "copilot/**"]
  workflow_dispatch:
# The release is a job of the run on main: never cancel that one.
concurrency:
  group: zephyr-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # Decides whether this run publishes a release (docs/release_plan.md): a push
  # to main that merges a pull request from develop, with a releasable change
  # and a version that has no tag yet.
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=false
          version="$(python3 scripts/release_version.py current)"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            pip install git-cliff
            from_develop="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                --jq '[.[] | select(.head.ref == "develop" and .base.ref == "main")] | length')"
            tagged=false
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then tagged=true; fi
            pending="$(python3 scripts/release_version.py pending)"
            echo "from develop: $from_develop, tag exists: $tagged, releasable change: $pending"
            if [[ "$from_develop" != "0" && "$tagged" == "false" && "$pending" == "true" ]]; then
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release: $release (v$version)" >> "$GITHUB_STEP_SUMMARY"

  # The firmware of every target (BCC, native_sim and later ones).
  firmware:
    needs: plan
    uses: ./.github/workflows/build-firmware.yml
    with:
      release: ${{ needs.plan.outputs.release == 'true' }}

  twister:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # west workspace layout: <workspace>/unimoc (this repository, the
          # manifest) next to <workspace>/zephyr and <workspace>/modules.
          path: unimoc
          submodules: recursive

      - name: Set up the west workspace, Zephyr SDK and Python requirements
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: unimoc
          toolchains: arm-zephyr-eabi

      # After the Zephyr setup: its requirements pull an unpinned clang-format
      # from pip, which would otherwise come first on PATH.
      - name: Install clang-format (pinned), clang-tidy, CodeChecker, Nunavut and pycyphal
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy
          pip install clang-format==22.1.1 codechecker
          pip install -r unimoc/scripts/requirements-cyphal.txt
          # pycyphal integration tests of the simulation (unimoc.app.cyphal_integration)
          pip install -r unimoc/scripts/requirements-cyphal-tools.txt
          clang-format --version

      - name: clang-format
        run: unimoc/scripts/check_format.sh

      - name: Twister with clang-tidy (native_sim, bcc)
        run: unimoc/scripts/twister_sca.sh

      # A failing pytest scenario only prints its command line in the twister
      # output: show the failure summary of each one as an annotation.
      - name: Report pytest failures
        if: failure()
        run: |
          for log in $(find twister-out -name twister_harness.log); do
            if grep -qE "^(FAILED|ERROR) |^E  " "$log"; then
              summary=$(grep -E "^(FAILED|ERROR) |^E  |Error:|error:" "$log" | head -40 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')
              echo "::error title=pytest ${log#twister-out/}::${summary}"
              echo "----- $log"; tail -150 "$log"
            fi
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: twister-out
          path: |
            twister-out/twister.json
            twister-out/twister_report.xml
            twister-out/**/sca/codechecker/
            twister-out/**/twister_harness.log
            twister-out/**/handler.log

  # Publishes the release of a merged develop pull request: tag, change log
  # and every firmware build, after the tests and builds of this run passed.
  release:
    needs: [plan, twister, firmware]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install git-cliff and Doxygen
        run: |
          pip install git-cliff
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz zip
      - name: The version file, the change log and the commits agree
        run: |
          python3 scripts/release_version.py check
          grep -q "^## \[${{ needs.plan.outputs.version }}\]" CHANGELOG.md
      - uses: actions/download-artifact@v8
        with:
          pattern: unimoc-*
          path: firmware
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: twister-out
          path: twister-out
      - name: Collect the release files
        run: |
          version="${{ needs.plan.outputs.version }}"
          cp "$(find twister-out -name twister.json | head -1)" "firmware/unimoc-twister-$version.json"
          mkdir -p build && doxygen docs/Doxyfile
          (cd build/doxygen && zip -qr "$GITHUB_WORKSPACE/firmware/unimoc-docs-$version.zip" html)
          (cd firmware && sha256sum unimoc-* > SHA256SUMS)
          python3 scripts/release_version.py notes > notes.md
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.plan.outputs.version }}"
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "UNIMOC v$version" --notes-file notes.md "${prerelease[@]}" firmware/*
