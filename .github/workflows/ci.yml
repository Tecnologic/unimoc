name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  hosted-test:
    name: Hosted build & test (Linux x86-64)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build

      - name: Install CMake 4.x
        run: pip install cmake --quiet

      - name: Configure
        run: |
          cmake -S . -B build/hosted \
                -DENABLE_TESTS=ON \
                -DHARDWARE_DIRECTORY="" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/hosted --target system_test

      - name: Test
        run: ./build/hosted/tests/system_test --gtest_color=yes
