# Console and log over USB CDC ACM (app/boards/bcc.overlay). The USB stack runs
# in threads and normal-priority interrupts, below the zero-latency hot path.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_RTT_CONSOLE=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="UNIMOC"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="UNIMOC BCC"
# The CDC ACM class must not log into itself (the log goes over it).
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
# VID/PID: the Zephyr defaults (0x2fe3, test use only) until UNIMOC has its own.

# The log also goes to SEGGER RTT, for bring-up with a debug probe before USB
# enumerates.
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=y
