# The bench log goes to SEGGER RTT (board defconfig) and, once the node is
# on the bus, to uavcan.diagnostic.Record. USB and the shell are not used
# until the USB DFU recovery path is added.
CONFIG_LOG_BACKEND_RTT=y

# FDCAN3 runs CAN FD frames at 1 Mbit/s in both phases (bcc.dts): the
# SN65HVD230 is a classic CAN transceiver, so the data phase does not switch.
# A bus with classic-only adapters needs CONFIG_UNIMOC_CYPHAL_CAN_FD=n.
CONFIG_UNIMOC_CYPHAL_CAN_BRS=n
