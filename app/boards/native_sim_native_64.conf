# 1 us kernel tick: resolves the PWM period (50 us at 20 kHz) in simulated time.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000000

# Interactive simulation: simulated time follows the wall clock
# (NATIVE_SIM_SLOWDOWN_TO_REAL_TIME, the default outside tests), so Cyphal
# tools see real-time heartbeats and telemetry.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y

# Cyphal RESTART re-executes the simulation.
CONFIG_NATIVE_SIM_REBOOT=y

# SocketCAN (app/boards/native_sim.overlay) and the slcan pseudo terminal.
CONFIG_CAN_NATIVE_LINUX=y

# The simulated rider and display (hardware/zephyr_sim/ebike_io.cpp) drive the e-bike control.
CONFIG_UNIMOC_EBIKE=y
