# NUCLEO-H743ZI whose on-board ST-LINK carries J-Link OB firmware (OpenOCD, no
# Segger software). Use: west flash --runner openocd --config <this file>
source [find interface/jlink.cfg]
transport select swd
adapter speed 500

source [find target/stm32h7x.cfg]
