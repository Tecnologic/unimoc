# NUCLEO-H743ZI bring-up of the STM32H7 platform (apps/drive/boards/nucleo_h743zi.overlay).
# The log goes to the ST-LINK virtual COM port (USART3, board console) and, once
# the node is on the bus, to uavcan.diagnostic.Record.

CONFIG_FPU=y
# The control thread and the Cyphal thread both compute in float: the FP
# registers are saved on a context switch (lazy stacking).
CONFIG_FPU_SHARING=y

# The sample interrupt runs above the kernel (docs/hotpath_plan.md).
CONFIG_ZERO_LATENCY_IRQS=y
CONFIG_GPIO=y
CONFIG_CLOCK_CONTROL=y
CONFIG_PINCTRL=y

# Link into the image partition of bank 1 (overlay); the settings live in bank 2.
CONFIG_USE_DT_CODE_PARTITION=y

# FDCAN1 runs CAN FD frames at 1 Mbit/s in both phases (overlay) for classic
# CAN transceiver modules. A bus with classic-only adapters needs
# CONFIG_UNIMOC_CYPHAL_CAN_FD=n.
CONFIG_UNIMOC_CYPHAL_CAN_BRS=n

# main() loads the settings from the ZMS partition: the default 1 KB overflows.
CONFIG_MAIN_STACK_SIZE=4096
