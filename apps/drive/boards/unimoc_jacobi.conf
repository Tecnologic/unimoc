# The bench log goes to SEGGER RTT (board defconfig) and, once the node is
# on the bus, to uavcan.diagnostic.Record. USB is not used until the USB DFU
# recovery path is added.
CONFIG_LOG_BACKEND_RTT=y

# The control thread and the Cyphal thread both compute in float: the FP
# registers are saved on a context switch (lazy stacking).
CONFIG_FPU_SHARING=y

# FDCAN1 runs CAN FD frames at 1 Mbit/s in both phases (unimoc_jacobi.dts),
# like the other nodes of the bus. A bus with classic-only adapters needs
# CONFIG_UNIMOC_CYPHAL_CAN_FD=n.
CONFIG_UNIMOC_CYPHAL_CAN_BRS=n

# main() loads the settings from the ZMS partition: the default 1 KB overflows.
CONFIG_MAIN_STACK_SIZE=4096
