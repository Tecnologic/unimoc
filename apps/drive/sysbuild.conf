#
# MCUboot of the STM32H7 boards (zephyr/Kconfig.sysbuild chooses it for
# unimoc_jacobi and nucleo_h743zi; docs/zephyr_workflow.md, firmware update).
# Swap using move: the image of slot 1 (bank 2, filled over Cyphal) takes the
# place of the image in slot 0 at the next start and runs once; the new image
# confirms itself (hardware/zephyr_stm32h7/firmware_bank.cpp), otherwise
# MCUboot swaps back.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
