tests:
  unimoc.app.drive.build:
    build_only: true
    platform_allow:
      - native_sim/native/64
      - unimoc_jacobi
      - nucleo_h743zi
    tags: [unimoc, app]
  # With MCUboot (sysbuild): the signed image, the flash layout, the firmware update bank of the STM32H7
  # (hardware/zephyr_stm32h7/firmware_bank.cpp). The other scenarios build the application alone.
  unimoc.app.drive.build.mcuboot:
    build_only: true
    sysbuild: true
    platform_allow:
      - unimoc_jacobi
      - nucleo_h743zi
    tags: [unimoc, app]
  # The M0 timing probes in the interrupts (CONFIG_UNIMOC_HOT_PATH_TIMING).
  unimoc.app.drive.build.timing:
    build_only: true
    platform_allow:
      - unimoc_jacobi
      - nucleo_h743zi
    extra_configs:
      - CONFIG_UNIMOC_HOT_PATH_TIMING=y
    tags: [unimoc, app]
  # Low-side shunts on the STM32H7 platform (foc0 current-sense = "low-side"): PWM mode 2, the control after the
  # valleys only. Build check only, no board has them yet. On Jacobi only: the overlay replaces the board overlay of
  # apps/drive/boards (the NUCLEO-H743ZI defines foc0 there).
  unimoc.app.drive.build.low_side:
    build_only: true
    platform_allow:
      - unimoc_jacobi
    extra_dtc_overlay_files:
      - boards/variants/low_side_current_sense.overlay
    tags: [unimoc, app]
  # The bench profile of the first power-on on the Nucleo adapter (12 V DC link, 20 A trip): the variant overlay is
  # added to the board overlay of apps/drive/boards.
  unimoc.app.drive.build.nucleo_bench:
    build_only: true
    platform_allow:
      - nucleo_h743zi
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=boards/variants/nucleo_bench_12v.overlay
    tags: [unimoc, app]
  # The simulation as a Cyphal node, tested from pycyphal over its slcan
  # pseudo terminal (tests/integration/cyphal_sim). Needs pycyphal, python-can
  # and pyserial (scripts/requirements-cyphal-tools.txt); skipped without them.
  unimoc.app.drive.cyphal_integration:
    harness: pytest
    platform_allow:
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
    harness_config:
      pytest_root:
        - "../../tests/integration/cyphal_sim"
      pytest_dut_scope: session
      # platformdirs >= 4.13 registers a pytest plugin; with a second, older
      # platformdirs on the path (pip --user on the CI runner's system
      # Python) its entry point fails to import and pytest aborts at start.
      pytest_args:
        - "-p"
        - "no:platformdirs"
        - "-m"
        - "not ebike"
    timeout: 300
    tags: [unimoc, app, cyphal]
  # The e-bike build (CONFIG_UNIMOC_EBIKE): the simulated rider and display
  # over the unimoc.sim.pedal_* and unimoc.sim.display_* registers
  # (test_ebike_sim.py, marker `ebike`). With the e-bike the readiness of the
  # bus no longer engages the drive, so the tests above run without it.
  unimoc.app.drive.cyphal_integration.ebike:
    harness: pytest
    platform_allow:
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
    extra_configs:
      - CONFIG_UNIMOC_EBIKE=y
    harness_config:
      pytest_root:
        - "../../tests/integration/cyphal_sim"
      pytest_dut_scope: session
      pytest_args:
        - "-p"
        - "no:platformdirs"
        - "-m"
        - "ebike"
    timeout: 300
    tags: [unimoc, app, cyphal]
