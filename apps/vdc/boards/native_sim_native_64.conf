# Interactive simulation: simulated time follows the wall clock
# (NATIVE_SIM_SLOWDOWN_TO_REAL_TIME, the default outside tests), so Cyphal
# tools see real-time heartbeats and wheel commands.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y

# SocketCAN (native_sim_native_64.overlay) and the slcan pseudo terminals.
CONFIG_CAN_NATIVE_LINUX=y
