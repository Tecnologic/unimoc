# The VDC on a NUCLEO-H743ZI (nucleo_h743zi.overlay). The log goes to the
# ST-LINK virtual COM port (USART3, board console) and, once the node is on
# the bus, to uavcan.diagnostic.Record.

CONFIG_FPU=y
CONFIG_GPIO=y

# FDCAN1 runs CAN FD frames at 1 Mbit/s in both phases (overlay) for classic
# CAN transceiver modules. A bus with classic-only adapters needs
# CONFIG_UNIMOC_CYPHAL_CAN_FD=n.
CONFIG_UNIMOC_CYPHAL_CAN_BRS=n
