CONFIG_CPP=y
CONFIG_UNIMOC=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_LOG=y
CONFIG_UNIMOC_LOG_LEVEL_DBG=y

# Cyphal/CAN node: heartbeat, registers, readiness, wheel command, drive
# status and the log as uavcan.diagnostic.Record (zephyr/Kconfig, UNIMOC_CYPHAL).
CONFIG_UNIMOC_CYPHAL=y

# The VDC keeps its registers in RAM (src/vdc/vdc_node.hpp): no settings storage.
CONFIG_UNIMOC_SETTINGS_ZMS=n
