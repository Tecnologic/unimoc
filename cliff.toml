#
# git-cliff configuration: next version and change log from Conventional
# Commits (docs/release_plan.md). Used by scripts/release_version.py only.

[changelog]
header = """
# Changelog

All notable changes of UNIMOC. Generated by `scripts/release_version.py` from
the commits (Conventional Commits); do not edit by hand.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Squash-merged PR titles are the only commits that matter; anything that is
# not a Conventional Commit (early history, plain merges) is left out.
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

# Release bumps and merge commits never appear in the change log and never
# count for the next version.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", skip = true },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^style", skip = true },
  { message = "^chore", skip = true },
]

[bump]
# Below 1.0 a breaking change and a feature raise the minor version, a fix the
# patch version. From 1.0 on a breaking change raises the major version
# (that step is taken with the release-as label).
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "0.1.0"
