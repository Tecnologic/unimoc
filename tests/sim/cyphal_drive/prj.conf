CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_UNIMOC=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000000
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_CBPRINTF_FP_SUPPORT=y
# slcan_media.cpp uses the UART API (the parser tests do not open a port).
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# M0 timing probes on (hardware/hot_path_timing.hpp), read through unimoc.timing.*.
CONFIG_UNIMOC_HOT_PATH_TIMING=y
