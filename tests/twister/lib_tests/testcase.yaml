  unimoc.lib.motor_control.sin_cos_test:
    extra_args: UNIMOC_TEST_SOURCE=motor_control/tests/sin_cos_test.cpp
  unimoc.lib.motor_control.stator_system_test:
    extra_args: UNIMOC_TEST_SOURCE=motor_control/tests/stator_system_test.cpp
  unimoc.lib.motor_control.svm_test:
