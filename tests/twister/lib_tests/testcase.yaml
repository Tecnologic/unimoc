# One scenario per lib test source; the lib code is built unchanged.
common:
  harness: gtest
  platform_allow: native_sim/native/64
  tags: unimoc lib
  timeout: 60
tests:
  unimoc.lib.cyphal.control_mode_test:
    extra_args: UNIMOC_TEST_SOURCE=cyphal/tests/control_mode_test.cpp
  unimoc.lib.cyphal.cyphal_interface_test:
    extra_args: UNIMOC_TEST_SOURCE=cyphal/tests/cyphal_interface_test.cpp
  unimoc.lib.cyphal.cyphal_transport_test:
    extra_args: UNIMOC_TEST_SOURCE=cyphal/tests/cyphal_transport_test.cpp
  unimoc.lib.cyphal.node_identity_test:
    extra_args: UNIMOC_TEST_SOURCE=cyphal/tests/node_identity_test.cpp
  unimoc.lib.motor_control.core_control_test:
    extra_args: UNIMOC_TEST_SOURCE=motor_control/tests/core_control_test.cpp
  unimoc.lib.motor_control.excitation_controller_test:
    extra_args: UNIMOC_TEST_SOURCE=motor_control/tests/excitation_controller_test.cpp
  unimoc.lib.motor_control.excitation_observer_test:
    extra_args: UNIMOC_TEST_SOURCE=motor_control/tests/excitation_observer_test.cpp
  unimoc.lib.motor_control.hfi_test:
    extra_args: UNIMOC_TEST_SOURCE=motor_control/tests/hfi_test.cpp
  unimoc.lib.motor_control.position_controller_test:
    extra_args: UNIMOC_TEST_SOURCE=motor_control/tests/position_controller_test.cpp
  unimoc.lib.motor_control.position_tracker_test:
    extra_args: UNIMOC_TEST_SOURCE=motor_control/tests/position_tracker_test.cpp
  unimoc.lib.motor_control.rotor_angle_test:
